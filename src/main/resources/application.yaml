spring:
  application:
    name: catalogo-service
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate      # las tablas las crea Flyway
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      repositories:
        enabled: false        # los repositorios son JPA; evita los avisos de Redis
      timeout: 5s
      connect-timeout: 5s

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP}

catedra:
  api:
    base-url: ${CATEDRA_API_URL}
    token: ${CATEDRA_JWT:}

server:
  port: 8081

jwt:
  secret: ${JWT_SECRET}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

catalog:
  sync:
    on-startup: true
    check-interval-ms: 300000   # cada 5 minutos
    max-attempts: 3
    retry-backoff-ms: 2000